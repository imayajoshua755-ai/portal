
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Portal</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h2>🎓 STUDENT PORTAL</h2>
    <p>Your academic information in one place</p>
  </header>

  <main class="container">

    <!-- LOGIN AND REGISTRATION -->

    <section id="authSection" class="card">

      <h2 id="formTitle">Student Login</h2>

      <p id="message"></p>

      <!-- LOGIN FORM -->

      <form id="loginForm">

        <input
          id="loginEmail"
          type="email"
          placeholder="Email Address"
          required
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          required
        >

        <button type="submit">LOGIN</button>

      </form>

      <!-- REGISTRATION FORM -->

      <form id="registerForm" class="hidden">

        <input
          id="name"
          type="text"
          placeholder="Full Name"
          required
        >

        <input
          id="regEmail"
          type="email"
          placeholder="Email Address"
          required
        >

        <input
          id="regPassword"
          type="password"
          placeholder="Create Password (minimum 8 characters)"
          minlength="8"
          required
        >

        <button type="submit">CREATE ACCOUNT</button>

      </form>

      <p id="switchText">
        Don't have an account?
        <a href="#" id="switchLink">Register here</a>
      </p>

    </section>


    <!-- STUDENT DASHBOARD -->

    <section id="dashboard" class="dashboard hidden">

      <div class="dashboard-heading">

        <div>
          <h2>Student Dashboard</h2>

          <p>
            Welcome, <span id="studentName"></span>!
          </p>
        </div>

        <button id="logoutButton" class="logout">
          LOGOUT
        </button>

      </div>


      <!-- STUDENT PROFILE -->

      <div class="student-profile">

        <h3>My Student Account</h3>

        <p>
          <strong>Student Name:</strong>
          <span id="displayName"></span>
        </p>

        <p>
          <strong>Email Address:</strong>
          <span id="displayEmail"></span>
        </p>

        <p>
          <strong>Account Status:</strong> Active
        </p>

      </div>


      <!-- STUDENT SERVICES -->

      <h3 class="section-heading">STUDENT SERVICES</h3>

      <div class="services-grid">

        <button class="service-card" data-page="academics">

          <span class="service-icon">📚</span>

          <strong>ACADEMICS</strong>

          <small>Courses and examination results</small>

        </button>


        <button class="service-card" data-page="fees">

          <span class="service-icon">💳</span>

          <strong>FEES</strong>

          <small>Fee statements and payments</small>

        </button>


        <button class="service-card" data-page="accommodation">

          <span class="service-icon">🏠</span>

          <strong>ACCOMMODATION</strong>

          <small>Hostel and room information</small>

        </button>


        <button class="service-card" data-page="graduation">

          <span class="service-icon">🎓</span>

          <strong>GRADUATION TRACKER</strong>

          <small>Track your graduation progress</small>

        </button>

      </div>


      <!-- SERVICE DETAILS -->

      <div id="serviceDetails" class="service-details hidden">

        <button id="backButton" class="back-button">
          ← Back to Dashboard
        </button>

        <h2 id="serviceTitle"></h2>

        <div id="serviceContent"></div>

      </div>

    </section>

  </main>


  <footer>
    <p>© 2026 Student Portal. All Rights Reserved.</p>
  </footer>


  <script src="app.js"></script>

</body>
</html>
