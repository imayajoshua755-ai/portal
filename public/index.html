
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h2>🎓 Student Portal</h2>
    <p>Your academic information in one place</p>
  </header>

  <main class="container">

    <section id="authSection" class="card">
      <h2 id="formTitle">Student Login</h2>
      <p id="message"></p>

      <form id="registerForm" class="hidden">
        <input id="name" type="text"
          placeholder="Full Name" required>
        <input id="regEmail" type="email"
          placeholder="Email Address" required>
        <input id="regPassword" type="password"
          placeholder="Create Password (8 characters minimum)"
          minlength="8" required>
        <button type="submit">Create Account</button>
      </form>

      <form id="loginForm">
        <input id="loginEmail" type="email"
          placeholder="Email Address" required>
        <input id="loginPassword" type="password"
          placeholder="Password" required>
        <button type="submit">Login</button>
      </form>

      <p id="switchText">
        Don't have an account?
        <a href="#" id="switchLink">Register here</a>
      </p>
    </section>

    <section id="dashboard" class="card hidden">
      <h2>Student Dashboard</h2>
      <h3>Welcome, <span id="studentName"></span>!</h3>

      <div class="info">
        <p><strong>Student Name:</strong>
          <span id="displayName"></span></p>
        <p><strong>Email Address:</strong>
          <span id="displayEmail"></span></p>
        <p><strong>Account:</strong> Active</p>
      </div>

      <button id="logoutButton" class="logout">
        Logout
      </button>
    </section>

  </main>

  <footer>
    <p>© 2026 Student Portal. All rights reserved.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
